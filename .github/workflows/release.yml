name: Build and Release Gpredict

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v2.2.1
    branches:
      - master  # Trigger on pushes to master for nightly builds
  workflow_dispatch:  # Enables manual triggering from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Determine build type
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TYPE=release" >> $GITHUB_ENV
            echo "ARTIFACT_SUFFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TYPE=nightly" >> $GITHUB_ENV
            echo "ARTIFACT_SUFFIX=nightly-${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi

      - name: Set up environment variables
        run: |
          echo "BUILD_DIR=build-${{ matrix.target }}" >> $GITHUB_ENV
          echo "INSTALL_DIR=install-${{ matrix.target }}" >> $GITHUB_ENV

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libcurl4-gnutls-dev \
            libgoocanvas-2.0-dev \
            libhamlib-dev \
            intltool \
            gettext

      - name: Install dependencies (Windows)
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libglib2.0-dev \
            gettext \
            intltool

      - name: Run autogen.sh
        run: |
          NOCONFIGURE=1 ./autogen.sh

      - name: Configure build
        run: |
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          if [ "${{ matrix.target }}" = "linux" ]; then
            ../configure --prefix=$GITHUB_WORKSPACE/$INSTALL_DIR
          else
            ../configure --host=x86_64-w64-mingw32 --prefix=$GITHUB_WORKSPACE/$INSTALL_DIR
          fi

      - name: Compile and install
        run: |
          cd $BUILD_DIR
          make -j$(nproc)
          make install

      - name: Archive binaries
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'gpredict-${{ matrix.target }}-${{ env.ARTIFACT_SUFFIX }}.zip'
          path: $INSTALL_DIR

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpredict-${{ matrix.target }}-${{ env.ARTIFACT_SUFFIX }}.zip
          path: gpredict-${{ matrix.target }}-${{ env.ARTIFACT_SUFFIX }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release type
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TYPE=release" >> $GITHUB_ENV
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TYPE=nightly" >> $GITHUB_ENV
            echo "RELEASE_TAG=nightly" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TYPE == 'nightly' && 'Gpredict nightly' || format('Gpredict {0}', github.ref_name) }}
          prerelease: ${{ env.RELEASE_TYPE == 'nightly' }}
          make_latest: ${{ env.RELEASE_TYPE == 'release' }}
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
